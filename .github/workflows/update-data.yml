name: Customs Attachment Test

"on":
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Find Customs attachment
        run: |
          curl -L --fail \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36" \
            -H "Accept-Language: ko-KR,ko;q=0.9,en;q=0.8" \
            -H "Referer: https://www.customs.go.kr/" \
            "https://www.customs.go.kr/kcs/na/ntt/selectNttInfo.do?mi=10316&bbsId=2062&nttSn=10175243&nttSnUrl=beeeabc8b7a950732cdd060eb129d716" \
            -o customs-page.html

          echo "===== Attachment links ====="
          grep -oE '/common/nttFileDownload\.do[^"'"'"' ]*' customs-page.html || true

          echo "===== XLSX references ====="
          grep -i -n -E 'xlsx|xls|환전영업자현황' customs-page.html || true
