name: Customs Latest Post Test

"on":
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Find latest Customs post
        run: |
          LIST_URL="https://www.customs.go.kr/kcs/na/ntt/selectNttList.do?mi=10316&bbsId=2062"

          curl -L --fail \
            --connect-timeout 20 \
            --max-time 60 \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36" \
            -H "Accept-Language: ko-KR,ko;q=0.9,en;q=0.8" \
            -H "Referer: https://www.customs.go.kr/" \
            "$LIST_URL" \
            -o customs-list.html

          python - <<'PY'
          import re
          from html import unescape

          with open("customs-list.html", "r", encoding="utf-8", errors="ignore") as f:
              html = f.read()

          pattern = re.compile(
              r'href="([^"]*selectNttInfo\.do[^"]*)"[^>]*>(.*?)</a>',
              re.I | re.S
          )

          found = None

          for href, title_html in pattern.findall(html):
              title = re.sub(r"<[^>]+>", "", title_html)
              title = unescape(title).strip()

              if "환전영업자" in title and "등록 현황" in title:
                  found = (href, title)
                  break

          if not found:
              raise SystemExit("ERROR: latest exchange-business post not found")

          href, title = found
          href = unescape(href)

          if href.startswith("/"):
              url = "https://www.customs.go.kr" + href
          else:
              url = "https://www.customs.go.kr/kcs/na/ntt/" + href

          print("SUCCESS: latest post found")
          print("TITLE:", title)
          print("URL:", url)
          PY
