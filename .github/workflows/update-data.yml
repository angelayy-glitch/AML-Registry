name: Customs List Check

"on":
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Customs list
        run: |
          curl -L \
            --connect-timeout 20 \
            --max-time 60 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36" \
            -H "Accept-Language: ko-KR,ko;q=0.9,en;q=0.8" \
            -H "Referer: https://www.customs.go.kr/" \
            "https://www.customs.go.kr/kcs/na/ntt/selectNttList.do?mi=10316&bbsId=2062" \
            -o list.html

          echo "===== EXCHANGE TEXT ====="
          grep -n -B 5 -A 5 "환전영업자" list.html | head -100 || true

          echo "===== NTT LINKS ====="
          grep -oE '.{0,150}nttSn.{0,250}' list.html | head -30 || true
