name: VASP KoFIU Access Test

"on":
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test KoFIU connections
        shell: bash
        run: |
          echo "===== TEST 1 : kofiu.go.kr ====="
          curl -I -L \
            --connect-timeout 30 \
            --max-time 60 \
            -A "Mozilla/5.0" \
            "https://kofiu.go.kr/kor/main.do" || true

          echo "===== TEST 2 : www.kofiu.go.kr ====="
          curl -I -L \
            --connect-timeout 30 \
            --max-time 60 \
            -A "Mozilla/5.0" \
            "https://www.kofiu.go.kr/kor/main.do" || true

          echo "===== TEST FINISHED ====="
