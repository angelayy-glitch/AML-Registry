name: FINE Excel Download Test

"on":
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download FINE Excel
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.parse
          import html
          import re
          import zipfile
          import sys

          page_url = "https://fine.fss.or.kr/fine/bbs/B0000392/view.do?nttId=63573&menuNo=900495&pageIndex=1"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36",
              "Accept-Language": "ko-KR,ko;q=0.9,en;q=0.8",
              "Referer": "https://fine.fss.or.kr/"
          }

          req = urllib.request.Request(page_url, headers=headers)
          with urllib.request.urlopen(req, timeout=90) as r:
              raw = r.read()

          text = raw.decode("utf-8", errors="ignore")
          text = html.unescape(text)

          print("FINE page downloaded:", len(raw), "bytes")

          matches = re.findall(
              r'href\s*=\s*["\']([^"\']*fileDown\.do[^"\']*)["\']',
              text,
              flags=re.I
          )

          print("Attachment links found:", len(matches))

          for link in matches:
              print("Candidate:", link)

          if not matches:
              print("ERROR: attachment link not found")
              sys.exit(1)

          file_path = matches[0]
          download_url = urllib.parse.urljoin(
              "https://fine.fss.or.kr/",
              file_path
          )

          print("Downloading:", download_url)

          req = urllib.request.Request(
              download_url,
              headers={
                  "User-Agent": headers["User-Agent"],
                  "Referer": page_url
              }
          )

          with urllib.request.urlopen(req, timeout=90) as r:
              data = r.read()

          filename = "fine-test.xlsx"

          with open(filename, "wb") as f:
              f.write(data)

          print("Downloaded:", len(data), "bytes")

          if not zipfile.is_zipfile(filename):
              print("ERROR: downloaded file is not a valid XLSX")
              sys.exit(1)

          print("SUCCESS: valid XLSX file")
          PY
