name: Update FINE Electronic Finance Data

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download FINE Excel
        shell: bash
        run: |
          PAGE_URL="https://fine.fss.or.kr/fine/bbs/B0000392/view.do?nttId=63573&menuNo=900495&pageIndex=1"

          curl -L --fail \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36" \
            -H "Accept-Language: ko-KR,ko;q=0.9,en;q=0.8" \
            -H "Referer: https://fine.fss.or.kr/" \
            "$PAGE_URL" \
            -o fine-page.html

          python3 -c 'from html.parser import HTMLParser; import html; \
          class_P=type("P",(HTMLParser,),{"links":[],"handle_starttag":lambda self,tag,attrs:self.links.extend([html.unescape(v) for k,v in attrs if tag.lower()=="a" and k.lower()=="href" and v and "fileDown.do" in v])}); \
          p=class_P(); p.feed(open("fine-page.html",encoding="utf-8",errors="ignore").read()); \
          open("attachment.txt","w").write(p.links[0] if p.links else "")'

          FILE_PATH="$(cat attachment.txt)"

          echo "Found attachment: ${FILE_PATH}"

          if [ -z "${FILE_PATH}" ]; then
            echo "ERROR: attachment not found"
            exit 1
          fi

          DOWNLOAD_URL="https://fine.fss.or.kr${FILE_PATH}"

          echo "Download URL: ${DOWNLOAD_URL}"

          curl -L --fail \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36" \
            -H "Referer: ${PAGE_URL}" \
            "${DOWNLOAD_URL}" \
            -o "전자금융업_최신.xlsx"

          python3 -c 'import zipfile,sys; f="전자금융업_최신.xlsx"; ok=zipfile.is_zipfile(f); print("SUCCESS: valid XLSX file" if ok else "ERROR: invalid XLSX file"); sys.exit(0 if ok else 1)'

          rm -f fine-page.html attachment.txt

      - name: Commit latest Excel
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "전자금융업_최신.xlsx"

          if git diff --cached --quiet; then
            echo "No change in FINE data."
            exit 0
          fi

          git commit -m "Update latest FINE electronic finance data"
          git push
