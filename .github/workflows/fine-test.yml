name: FINE Excel Download Test

"on":
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download FINE Excel
        shell: bash
        run: |
          PAGE_URL="https://fine.fss.or.kr/fine/bbs/B0000392/view.do?nttId=63573&menuNo=900495&pageIndex=1"

          # 1. FINE 게시물은 성공했던 curl 방식으로 받기
          curl -L --fail \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: ko-KR,ko;q=0.9,en;q=0.8" \
            -H "Referer: https://fine.fss.or.kr/" \
            "$PAGE_URL" \
            -o fine-page.html

          echo "FINE page downloaded"
          ls -lh fine-page.html

          # 2. 인터넷 접속 없이 저장된 HTML에서 첨부주소만 찾기
          FILE_PATH=$(python3 - <<'PY'
          from html.parser import HTMLParser
          import html

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "a":
                      return
                  for key, value in attrs:
                      if key.lower() == "href" and value:
                          value = html.unescape(value)
                          if "fileDown.do" in value:
                              self.links.append(value)

          with open("fine-page.html", "r", encoding="utf-8", errors="ignore") as f:
              text = f.read()

          parser = LinkParser()
          parser.feed(text)

          if parser.links:
              print(parser.links[0])
          PY
          )

          echo "Found attachment: $FILE_PATH"

          if [ -z "$FILE_PATH" ]; then
            echo "ERROR: attachment not found"
            exit 1
          fi

          # 3. 실제 첨부파일은 다시 curl로 다운로드
          if [[ "$FILE_PATH" == http* ]]; then
            DOWNLOAD_URL="$FILE_PATH"
          else
            DOWNLOAD_URL="https://fine.fss.or.kr$FILE_PATH"
          fi

          echo "Download URL: $DOWNLOAD_URL"

          curl -L --fail \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36" \
            -H "Referer: $PAGE_URL" \
            "$DOWNLOAD_URL" \
            -o fine-test.xlsx

          # 4. 진짜 XLSX인지 검사
          python3 - <<'PY'
          import zipfile
          import sys
          import os

          filename = "fine-test.xlsx"

          print("Downloaded size:", os.path.getsize(filename), "bytes")

          if not zipfile.is_zipfile(filename):
              print("ERROR: downloaded file is not a valid XLSX")
              sys.exit(1)

          print("SUCCESS: valid XLSX file")
          PY
