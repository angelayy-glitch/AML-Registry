name: Update KRX KIND Listed Companies

"on":
  workflow_dispatch:
  schedule:
    - cron: "10 21 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download KRX KIND listed companies
        shell: bash
        run: |
          set -e

          URL="https://kind.krx.co.kr/corpgeneral/corpList.do?method=download"

          curl -L --fail \
            --connect-timeout 20 \
            --max-time 90 \
            -A "Mozilla/5.0" \
            -o kind-temp.xls \
            "$URL"

          iconv -f EUC-KR -t UTF-8 kind-temp.xls > kind-listed.html

          if ! grep -q "삼성전자" kind-listed.html; then
            echo "::error::KIND 상장법인 자료를 정상적으로 읽지 못했습니다."
            exit 1
          fi

          rm kind-temp.xls

          echo "KIND 상장법인 자료 확인 성공"

      - name: Commit updated KIND data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kind-listed.html

          if git diff --cached --quiet; then
            echo "변경된 KIND 자료가 없습니다."
            exit 0
          fi

          git commit -m "Update KRX KIND listed companies"
          git push
