name: KRX KIND Download Test

"on":
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download and check KRX KIND listed companies
        shell: bash
        run: |
          URL="https://kind.krx.co.kr/corpgeneral/corpList.do?method=download"

          curl -L --fail \
            --connect-timeout 20 \
            --max-time 90 \
            -A "Mozilla/5.0" \
            -o kind-listed.xls \
            "$URL"

          echo "===== FILE INFO ====="
          ls -lh kind-listed.xls
          file kind-listed.xls

          echo "===== CONVERT TO UTF-8 ====="
          iconv -f EUC-KR -t UTF-8 kind-listed.xls > kind-listed-utf8.html

          echo "===== COMPANY CHECK ====="
          if grep -q "삼성전자" kind-listed-utf8.html; then
            echo "성공: 삼성전자를 찾았습니다."
          else
            echo "::error::삼성전자를 찾지 못했습니다."
            exit 1
          fi

          echo "===== SAMPLE ====="
          grep -n "삼성전자" kind-listed-utf8.html | head -3
